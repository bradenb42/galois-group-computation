name: Generate measurement figures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-figures.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependency
        run: python -m pip install matplotlib==3.10.8
      - name: Generate figures from recorded measurements
        run: |
          python - <<'PY'
          import json
          import measurements
          with open('measurements.json') as fh:
              meas = json.load(fh)
          measurements.figures(meas, outdir='figures', verbose=True)
          PY
      - name: Commit figures and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/generate-figures.yml
          git add figures/
          git commit -m 'Add generated measurement figures'
          git push
