name: Assemble certificate specification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-spec.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact uploaded specification
        run: |
          cat .tmp_spec_00.b64 .tmp_spec_01.b64 .tmp_spec_02.b64 .tmp_spec_03.b64 .tmp_spec_04.b64 .tmp_spec_05.b64 | base64 -d | gzip -d > galois_certificate_spec.md
          test "$(git hash-object galois_certificate_spec.md)" = "26e3484f16adecaf6827f4b4d3685fff8e56a29c"
      - name: Commit specification and clean staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add galois_certificate_spec.md
          git rm .tmp_spec_00.b64 .tmp_spec_01.b64 .tmp_spec_02.b64 .tmp_spec_03.b64 .tmp_spec_04.b64 .tmp_spec_05.b64 .github/workflows/assemble-spec.yml
          git commit -m 'Add Galois certificate specification'
          git push
