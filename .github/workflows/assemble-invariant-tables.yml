name: Assemble invariant tables

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-invariant-tables.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify invariant tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tables
          base64 -d .upload_staging/invariants.xz.b64 | xz -d > tables/invariants.json
          cat .upload_staging/invariants_descent.part0 \
              .upload_staging/invariants_descent.part1 \
              .upload_staging/invariants_descent.part2 \
              .upload_staging/invariants_descent.part3 \
            | base64 -d | xz -d > tables/invariants_descent.json

          test "$(git hash-object tables/invariants.json)" = "a5403061973214ecf9bedef2c785b3d3fc1a460a"
          test "$(git hash-object tables/invariants_descent.json)" = "e0c4678ca799d4e9259bab24c61463730885e47a"

          python - <<'PY'
          import json
          with open('tables/invariants.json') as f:
              a = json.load(f)
          with open('tables/invariants_descent.json') as f:
              b = json.load(f)
          assert len(a) == 8, len(a)
          assert len(b) == 91, len(b)
          print('verified invariant table counts:', len(a), len(b))
          PY

      - name: Commit tables and remove upload staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tables/invariants.json tables/invariants_descent.json
          git rm -f .upload_staging/invariants.xz.b64 \
                    .upload_staging/invariants_descent.part0 \
                    .upload_staging/invariants_descent.part1 \
                    .upload_staging/invariants_descent.part2 \
                    .upload_staging/invariants_descent.part3 \
                    .github/workflows/assemble-invariant-tables.yml
          git commit -m "Add invariant tables"
          git push
